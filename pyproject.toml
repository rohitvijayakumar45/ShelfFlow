[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfflow"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
 "fastapi==0.115.12", "uvicorn[standard]==0.34.2", "pydantic==2.11.4",
 "SQLAlchemy==2.0.40", "alembic==1.15.2", "psycopg[binary]==3.2.9",
 "redis==5.2.1", "rq==2.3.2", "paho-mqtt==2.1.0", "httpx==0.28.1",
 "PyJWT==2.10.1", "python-dotenv==1.1.0"
]
[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-cov==6.1.1"]
vision = ["ultralytics==8.4.174", "opencv-python==4.11.0.86", "numpy==2.2.5", "PyYAML==6.0.2"]
firmware = ["platformio==6.1.18"]
[tool.setuptools.packages.find]
include = ["backend*", "vision*", "simulator*", "tools*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests", "vision/tests"]
pythonpath = ["."]
