[env:devkitc-v4-proposed]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.3.1
  miguelbalboa/MFRC522@1.4.12
  bogde/HX711@0.7.5

; Bench diagnosis: sensors + DIAG output with the Wi-Fi radio off. Never used for shopping trials.
[env:devkitc-v4-offline]
extends = env:devkitc-v4-proposed
build_flags = -DDEVICE_OFFLINE=1

; Weak-supply build: Wi-Fi transmit power 8.5 dBm (default 19.5), radio started 3 s after the sensors,
; CPU at 160 MHz. Cuts the current spikes that trip the brownout detector; brownout detection stays ON.
[env:devkitc-v4-lowpower]
extends = env:devkitc-v4-proposed
board_build.f_cpu = 160000000L
build_flags = -DDEVICE_WIFI_TX_POWER=WIFI_POWER_8_5dBm -DDEVICE_WIFI_DELAY_MS=3000

; Diagnose shared-bus RFID on jumper wires with Wi-Fi disabled and slower SPI.
[env:devkitc-v4-rfid-diagnostic]
extends = env:devkitc-v4-proposed
upload_speed = 115200
build_flags = -DDEVICE_OFFLINE=1 -DMFRC522_SPICLOCK=1000000u -DRFID_DIAGNOSTIC=1

; Physical integration through the laptop: Wi-Fi off, durable USB pull/ACK.
; Two 10 kg cells (A left, C right); the weighing self-test runs at boot.
[env:devkitc-v4-usb-integration]
extends = env:devkitc-v4-rfid-diagnostic
build_flags = ${env:devkitc-v4-rfid-diagnostic.build_flags} -DUSB_RUNTIME=1 -DWEIGHING_SELF_TEST=1
