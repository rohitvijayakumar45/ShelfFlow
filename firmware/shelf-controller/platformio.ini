[env:devkitc-v4-proposed]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.3.1
  miguelbalboa/MFRC522@1.4.12
  bogde/HX711@0.7.5

; Bench diagnosis: sensors + DIAG output with the Wi-Fi radio off. Never used for shopping trials.
[env:devkitc-v4-offline]
extends = env:devkitc-v4-proposed
build_flags = -DDEVICE_OFFLINE=1
