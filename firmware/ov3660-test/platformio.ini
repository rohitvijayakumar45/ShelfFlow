[platformio]
default_envs = identify-only

[env]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
monitor_dtr = 0
monitor_rts = 0

[env:identify-only]

; Use ONLY for a carrier verified to use the AI-Thinker camera wiring.
[env:ai-thinker-camera-test]
build_flags = -DCAMERA_PINMAP_VERIFIED=1
