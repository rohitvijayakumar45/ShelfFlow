; Unconfigured diagnostic build is intentional. Change board ONLY after identifying the carrier.
[platformio]
default_envs = unconfigured-diagnostic

[env:unconfigured-diagnostic]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; A real carrier environment must add its confirmed board/PSRAM settings and board_config.h.

[env:camera-api-check]
extends = env:unconfigured-diagnostic
build_flags = -DCAMERA_API_CHECK=1
; Compile the configured camera code against the SDK with disabled sentinel pins.
; Setup NEVER initializes hardware in this environment. This is not a pin mapping.
