; Unconfigured diagnostic build is intentional. Change board ONLY after identifying the carrier.
[platformio]
default_envs = unconfigured-diagnostic

[env:unconfigured-diagnostic]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; A real carrier environment must add its confirmed board/PSRAM settings and board_config.h.

[env:camera-api-check]
extends = env:unconfigured-diagnostic
build_flags = -DCAMERA_API_CHECK=1
; Compile the configured camera code against the SDK with disabled sentinel pins.
; Setup NEVER initializes hardware in this environment. This is not a pin mapping.

; ---- ESP32-CAM-style carrier flashed through a second ESP32 (see docs/programming-camera.md) ----
; Upload runs at 115200 with no automatic reset: the target is put in download mode by hand
; (IO0 to GND + RST). 115200 is required by the software UART2 bridge and is safest on jumper wires.
[esp32cam_common]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
; Keep DTR/RTS released so opening the monitor never resets a software-bridge programmer.
monitor_dtr = 0
monitor_rts = 0

; Step 1: prints chip, flash, PSRAM and MAC. Drives NO camera pins and never starts Wi-Fi.
[env:esp32cam-identify]
extends = esp32cam_common
build_flags = -DCAMERA_IDENTIFY=1

; Step 2: tries the AI-Thinker CANDIDATE map once, reads the sensor PID, grabs one JPEG,
; then de-initializes. Never starts Wi-Fi. Prints PROBE_PASS or PROBE_FAIL.
[env:esp32cam-pinmap-probe]
extends = esp32cam_common
build_flags = -DCAMERA_PINMAP_PROBE=1

; Step 3: the real camera server. Requires include/board_config.h (BOARD_CONFIRMED) and
; include/secrets.h; without board_config.h it boots the safe UNCONFIGURED message.
[env:esp32cam]
extends = esp32cam_common
