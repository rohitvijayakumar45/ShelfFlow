[env:wroom32-uart-bridge]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Opening the monitor must not reset the bridge through the DevKit auto-reset transistors.
monitor_dtr = 0
monitor_rts = 0
; Proposed ONLY for a separate ESP32-WROOM-32 DevKit with onboard USB-UART.
; GPIO16/17 may belong to PSRAM on WROVER. Verify module before wiring.
